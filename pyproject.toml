[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drct-mindspore"
version = "0.1.0"
description = "Verified, staged MindSpore reproduction of official DRCT-L x4"
requires-python = ">=3.11"
dependencies = ["numpy>=1.24,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
markers = [
  "mindspore: requires the target MindSpore runtime",
  "reference: requires PyTorch and pinned upstream checkouts",
]
